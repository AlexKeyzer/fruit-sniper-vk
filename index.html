<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Фруктовый Снайпер</title>
    <meta property="og:title" content="Фруктовый Снайпер">
    <meta name="vk-game-title" content="Фруктовый Снайпер">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-context-menu: none;
            context-menu: none;
        }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            touch-action: none;
            -ms-touch-action: none;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('bg.jpg') center/cover no-repeat;
            z-index: -1;
        }
        .game-wrapper {
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: url('bg.jpg') center/cover no-repeat;
            position: relative;
        }
        .game-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }
        .game-container {
            position: relative;
            width: 100%; height: 100%;
            max-width: 56.25vh;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            background: url('bg.jpg') center/cover no-repeat;
            z-index: 1;
        }
        @media (min-aspect-ratio: 9/16) {
            .game-container { max-width: 100vw; height: 177.78vw; max-height: 100vh; }
        }
        #igrovoePole {
            width: 100%; height: 100%;
            display: block;
            image-rendering: auto;
            touch-action: none;
        }
        #interfeis {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 10;
        }
        #preloader {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            pointer-events: auto;
        }
        #preloader.hidden { display: none; }
        .preloader-title {
            font-size: 28px;
            font-weight: bold;
            color: #FFD700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px #000;
        }
        .preloader-bar-container {
            width: 70%;
            max-width: 280px;
            height: 14px;
            background: rgba(255,255,255,0.15);
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .preloader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 7px;
            transition: width 0.2s ease;
        }
        .preloader-percent {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }
        #panelZvuka {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            pointer-events: auto;
            z-index: 100;
            transform-origin: top left;
            transition: transform 0.2s ease;
        }
        .knopkaZvukaOformlenie {
            background: none; border: none;
            color: white; font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; margin: 0; outline: none;
        }
        #polzunokZvuka {
            width: 50px;
            cursor: pointer;
            accent-color: #4CAF50;
            -webkit-appearance: none; appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.3);
            margin: 0;
        }
        #polzunokZvuka::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            cursor: pointer;
        }
        /* === КНОПКА ПАУЗЫ === */
        #panelPauza {
            position: absolute;
            top: 10px; left: 50%;
            margin-left: -20px;
            width: 40px; height: 40px;
            background: rgba(0,0,0,0.6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 100;
            transform-origin: center top;
        }
        .knopkaPauzaOformlenie {
            background: none; border: none;
            color: white; font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; margin: 0; outline: none;
        }
        #panelYazyka {
            position: absolute;
            bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 15px;
            pointer-events: auto;
            z-index: 100;
            transform-origin: bottom left;
            transition: transform 0.2s ease;
        }
        .knopkaYazykaOformlenie {
            background: none; border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 0; margin: 0; outline: none;
        }
        #panelMonet {
            position: absolute;
            top: 10px; right: 10px; left: auto;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: gold;
            font-size: 18px;
            font-weight: bold;
            pointer-events: auto;
            z-index: 50;
            transform-origin: top right;
            transition: transform 0.2s ease;
            white-space: nowrap;
            text-shadow: 2px 2px 4px #000;
        }
        .game-hud {
            position: absolute;
            top: 10px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 24px;
            color: #FFFFFF;
            text-shadow: 2px 2px 4px #000000;
            pointer-events: none;
            z-index: 50;
            white-space: nowrap;
            line-height: 1.2;
            display: flex;
            align-items: center;
        }
        #panelLevel { left: 10px; text-align: left; justify-content: flex-start; }
        #panelNozhei { right: 10px; text-align: right; justify-content: flex-end; }
        .ikonkaMonety { width: 20px; height: 20px; pointer-events: none; }
        .ekran {
            pointer-events: auto;
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            width: 85%;
            max-width: 320px;
            max-height: 85vh;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transform-origin: center center;
        }
        .ekran.main-menu { padding: 20px; gap: 15px; max-width: 280px; }
        .ekran.main-menu .knopka { padding: 15px 20px; font-size: 18px; }
        .popup-overlay {
            position: absolute !important;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            width: 90%;
            max-width: 300px;
            max-height: 90vh;
        }
        .popup-scale-target { transition: transform 0.2s ease; }
        .skryto { display: none !important; }
        h1 {
            margin: 0; font-size: 24px;
            text-shadow: 2px 2px 4px #000;
            word-wrap: break-word;
            line-height: 1.2;
            hyphens: auto;
        }
        h2 { margin: 0; color: #FFD700; text-shadow: 1px 1px 2px #000; }
        .krasnyiTekst { color: #ff4444; }
        .knopka {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2E7D32;
            transition: 0.1s;
            width: 100%;
            outline: none;
            line-height: 1.3;
            flex-shrink: 0;
            word-wrap: break-word;
        }
        .knopkaReklama {
            background: #E91E63;
            box-shadow: 0 4px 0 #C2185B;
            animation: puls 1.5s infinite;
            position: relative;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .btn-icon { font-size: 20px; display: block; }
        .btn-text { display: block; line-height: 1.2; font-size: 13px; }
        .btn-text small { font-size: 10px; opacity: 0.9; display: block; }
        .knopka:active { transform: translateY(4px); box-shadow: none; }
        .knopka:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 0 4px 0 #2E7D32 !important;
        }
        .knopkaMagazinaCvet { background: #9C27B0; box-shadow: 0 4px 0 #6A1B9A; }
        .knopka.serya { background: #555; box-shadow: 0 4px 0 #333; }
        @keyframes puls { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .ruletkaBlok {
            background: linear-gradient(45deg, #4a148c, #311b92);
            border: 2px solid #FFD700;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        #kartinkaSunduka {
            width: 40px; height: 40px;
            filter: drop-shadow(0 0 10px #FFD700);
            animation: plavnayaTryaska 3s infinite;
            pointer-events: none;
            flex-shrink: 0;
        }
        @keyframes plavnayaTryaska {
            0%, 90% { transform: rotate(0deg); }
            92% { transform: rotate(10deg); }
            94% { transform: rotate(-10deg); }
            96% { transform: rotate(10deg); }
            98% { transform: rotate(-10deg); }
            100% { transform: rotate(0deg); }
        }
        .chest-opening { animation: chestBurst 0.8s ease-in-out forwards !important; }
        @keyframes chestBurst {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            20% { transform: scale(1.2) rotate(-15deg); filter: brightness(1.5); }
            40% { transform: scale(1.2) rotate(15deg); filter: brightness(1.5); }
            60% { transform: scale(1.3) rotate(-20deg); filter: brightness(2); }
            80% { transform: scale(1.4) rotate(20deg); filter: brightness(2.5); }
            100% { transform: scale(0) rotate(0deg); filter: brightness(3); opacity: 0; }
        }
        .flash-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: white;
            z-index: 9999;
            pointer-events: none;
            animation: fadeOut 1s forwards;
        }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .setka {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-height: 40vh;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: #666 transparent;
        }
        .setka::-webkit-scrollbar { width: 5px; }
        .setka::-webkit-scrollbar-track { background: transparent; }
        .setka::-webkit-scrollbar-thumb { background: #666; border-radius: 3px; }
        .kartochkaSkina {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .kartochkaSkina.legendary {
            background: linear-gradient(135deg, #b8860b 0%, #ffd700 50%, #b8860b 100%);
            border: 1px solid white;
        }
        .kartochkaSkina img {
            height: 40px;
            object-fit: contain;
            filter: drop-shadow(2px 4px 6px black);
            pointer-events: none;
        }
        .nazvanieSkina { font-size: 11px; font-weight: bold; color: white; text-align: center; }
        .opisanieSkina {
            font-size: 9px;
            color: #b3e5fc;
            min-height: 20px;
            display: flex;
            align-items: center;
            text-align: center;
        }
        .MknopkaKupit, .MknopkaVybrat, .MknopkaVybrano {
            background: #FF9800;
            color: white;
            border: none;
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 11px;
        }
        .MknopkaVybrat { background: #2196F3; }
        .MknopkaVybrano { background: #4CAF50; cursor: default; opacity: 0.8; }
        .MknopkaKupit:disabled { background: #555; cursor: not-allowed; color: #aaa; }
        @media (max-width: 400px) {
            .game-container { max-width: 100vw; }
            .ekran, .popup-overlay { padding: 10px; width: 95%; gap: 8px; max-height: 85vh; }
            .ekran.main-menu { padding: 15px; gap: 12px; }
            .ekran.main-menu .knopka { padding: 12px 15px; font-size: 16px; }
            h1 { font-size: 20px; }
            .knopka { font-size: 12px; padding: 8px 10px; }
            .knopkaReklama { padding: 10px 12px; }
            .btn-icon { font-size: 20px; }
            .btn-text small { font-size: 10px; }
            #panelMonet, .game-hud { font-size: 16px; padding: 4px 8px; }
            .ikonkaMonety { width: 18px; height: 18px; }
            #panelZvuka { padding: 4px 8px; }
            #polzunokZvuka { width: 45px; }
        }
        @media (max-width: 320px) {
            .ekran, .popup-overlay { padding: 8px; gap: 6px; }
            .ekran.main-menu { padding: 12px; gap: 10px; }
            .ekran.main-menu .knopka { padding: 10px 12px; font-size: 14px; }
            h1 { font-size: 18px; }
            .knopka { font-size: 11px; padding: 6px 8px; }
            .btn-icon { font-size: 18px; }
            .btn-text small { font-size: 9px; }
            #panelMonet, .game-hud { font-size: 14px; }
        }
        @media (max-height: 500px) {
            .ekran, .popup-overlay { max-height: 90vh; padding: 8px; gap: 5px; }
            .ekran.main-menu { padding: 12px; gap: 10px; }
            .ekran.main-menu .knopka { padding: 10px 12px; font-size: 14px; }
            h1 { font-size: 18px; }
            .knopka { padding: 6px 8px; font-size: 11px; }
            .btn-icon { font-size: 16px; }
            .btn-text small { font-size: 9px; }
        }
        @media (max-width: 280px) {
            h1 { font-size: 16px; }
            .btn-text { font-size: 10px; }
            .btn-text small { font-size: 8px; }
            .ekran.main-menu { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container" id="gameContainer">
            <canvas id="igrovoePole"></canvas>
            <div id="preloader">
                <div class="preloader-title">ФРУКТОВЫЙ СНАЙПЕР</div>
                <div class="preloader-bar-container">
                    <div class="preloader-bar" id="preloaderBar"></div>
                </div>
                <div class="preloader-percent" id="preloaderPercent">0%</div>
            </div>
            <div id="interfeis">
                <div id="panelZvuka">
                    <button id="knopkaZvuka" class="knopkaZvukaOformlenie" aria-label="Sound">🔊</button>
                    <input type="range" id="polzunokZvuka" min="0" max="1" step="0.1" value="0.4" aria-label="Volume">
                </div>
                <div id="panelPauza" class="skryto">
                    <button id="knopkaPauza" class="knopkaPauzaOformlenie" aria-label="Pause">❚❚</button>
                </div>
                <div id="panelYazyka">
                    <button id="knopkaYazyka" class="knopkaYazykaOformlenie" aria-label="Language">🌐 RU</button>
                </div>
                <div id="panelMonet">
                    <img src="apple.png" alt="Apples" class="ikonkaMonety">
                    <span id="schetMonet">0</span>
                </div>
                <div id="panelLevel" class="game-hud skryto">
                    <span id="tekstLevel">Level: 1</span>
                </div>
                <div id="panelNozhei" class="game-hud skryto">
                    <span id="tekstNozhei">Knives: 5</span>
                </div>
                <div id="glavnoeMenu" class="ekran main-menu popup-scale-target">
                    <button id="knopkaIgrat" class="knopka">PLAY</button>
                    <button id="knopkaMagazin" class="knopka knopkaMagazinaCvet">SKINS SHOP</button>
                </div>
                <div id="ekranMagazina" class="ekran popup-scale-target skryto">
                    <h2 id="ui_armory">ARMORY</h2>
                    <div class="ruletkaBlok">
                        <img src="chest.png" id="kartinkaSunduka" alt="Chest">
                        <div>
                            <h3 id="ui_chest" style="margin:0; color: #FFD700;">LUCKY CHEST</h3>
                            <p id="ui_chance" style="margin:5px 0; font-size:12px; color:#aaa;">Legendary Chance: 5%</p>
                            <button class="knopka MknopkaKupit" id="knopkaSunduk" onclick="window._game.otkrytSunduk()">OPEN (30 🍎)</button>
                        </div>
                    </div>
                    <div id="setkaSkinov" class="setka"></div>
                    <button id="knopkaNazadIzMagazina" class="knopka">BACK TO MENU</button>
                </div>
                <div id="ekranPauzy" class="ekran popup-overlay popup-scale-target skryto">
                    <h2 id="ui_pauseTitle">PAUSE</h2>
                    <button id="knopkaProdolzit" class="knopka">CONTINUE</button>
                    <button id="knopkaRestartPauza" class="knopka serya">RESTART</button>
                    <button id="knopkaVMenyu" class="knopka knopkaMagazinaCvet">MAIN MENU</button>
                </div>
                <div id="popupNagrada" class="ekran popup-overlay popup-scale-target skryto">
                    <h2 id="ui_reward" style="color:white;">REWARD!</h2>
                    <h1 id="tekstNagrady" style="color: #FFD700; margin: 10px 0; font-size: 30px;">50 🍎</h1>
                    <button id="ui_claim" class="knopka" onclick="window._game.zakrytPopup()">CLAIM</button>
                </div>
                <div id="ekranProigrysha" class="ekran popup-overlay popup-scale-target skryto">
                    <h1 id="ui_gameover" class="krasnyiTekst" style="font-size: 22px;">GAME OVER!</h1>
                    <p><span id="ui_lvl_text">Level:</span> <span id="tekushiyUrovenUI">1</span></p>
                    <button id="knopkaVoskresheniya" class="knopka knopkaReklama">
                        <span class="btn-icon">🎬</span>
                        <span class="btn-text">CONTINUE<br><small>FOR VIDEO AD</small></span>
                    </button>
                    <button id="knopkaZanovo" class="knopka serya">RESTART</button>
                    <button id="knopkaVMenyuGO" class="knopka knopkaMagazinaCvet">MAIN MENU</button>
                </div>
            </div>
        </div>
    </div>

<script>
(function() {
    'use strict';

    // ============================================
    // PLATFORM ADAPTER — VK Bridge
    // ============================================
    const PlatformAdapter = {
        platform: 'web',
        vkBridge: null,
        sessionStartTime: Date.now(),
        lastInterstitialTime: 0,
        userId: null,

        async init() {
            try {
                if (typeof vkBridge !== 'undefined' && vkBridge) {
                    await vkBridge.send('VKWebAppInit');
                    this.platform = 'vk';
                    this.vkBridge = vkBridge;
                    console.log('[VK] Bridge initialized');

                    try {
                        const user = await vkBridge.send('VKWebAppGetUserInfo');
                        this.userId = user.id;
                    } catch (e) {
                        console.warn('[VK] Cannot get user info:', e);
                    }

                    if (vkBridge.subscribe) {
                        vkBridge.subscribe((event) => {
                            if (event.detail && event.detail.type === 'VKWebAppViewHide') {
                                pauseGameForAd();
                            }
                        });
                    }
                } else {
                    console.log('[VK] Bridge not found, using web mode');
                    this.platform = 'web';
                }
            } catch (e) {
                console.error('[VK] Init error:', e);
                this.platform = 'web';
            }
        },

        signalReady() {
            if (this.platform === 'vk' && this.vkBridge) {
                try {
                    this.vkBridge.send('VKWebAppSetViewSettings', {
                        status_bar_style: 'dark',
                        action_bar_color: '#000000'
                    }).catch(() => {});
                } catch (e) {}
            }
        },

        async saveData(data) {
            try {
                localStorage.setItem('vk_snaiper_monety', String(data.monety));
                localStorage.setItem('vk_snaiper_skins', JSON.stringify(data.skins));
                localStorage.setItem('vk_snaiper_selectedSkin', data.selectedSkin);
                localStorage.setItem('vk_snaiper_volume', String(data.volume));
                localStorage.setItem('vk_snaiper_muted', data.muted ? '1' : '0');
                if (this.platform === 'vk' && this.vkBridge) {
                    await this.vkBridge.send('VKWebAppStorageSet', {
                        key: 'vk_snaiper_save',
                        value: JSON.stringify(data)
                    }).catch(() => {});
                }
            } catch (e) {
                console.warn('[VK] Save error:', e);
            }
        },

        async loadData() {
            try {
                if (this.platform === 'vk' && this.vkBridge) {
                    const result = await this.vkBridge.send('VKWebAppStorageGet', {
                        keys: ['vk_snaiper_save']
                    });
                    if (result && result.keys && result.keys.length > 0 && result.keys[0].value) {
                        try {
                            const data = JSON.parse(result.keys[0].value);
                            if (data && typeof data === 'object') return data;
                        } catch (e) {}
                    }
                }
                const m = parseInt(localStorage.getItem('vk_snaiper_monety'));
                const s = JSON.parse(localStorage.getItem('vk_snaiper_skins') || 'null');

            const now = Date.now();

            if (!allowed) {
                if (onClose) onClose();
                return;
            }
            if (this.platform !== 'vk' || !this.vkBridge) {
                if (onClose) onClose();
                return;

            try {
                if (onOpen) onOpen();
                await this.vkBridge.send('VKWebAppShowNativeAds', {
                    ad_format: 'interstitial'
                });
                this.lastInterstitialTime = Date.now();
                if (onClose) onClose();

                if (onError) onError();

    function nastroikaEkrana() {
        let winWidth, winHeight;

            winWidth = window.visualViewport.width;
            winHeight = window.visualViewport.height;
        } else {
            winWidth = window.innerWidth;
            winHeight = window.innerHeight;
        }
        winWidth = Math.max(0, winWidth - 20);
        winHeight = Math.max(0, winHeight - 20);
        const aspectRatio = 9 / 16;
        let finalWidth, finalHeight;
        if (winWidth / winHeight > aspectRatio) {
            finalHeight = winHeight;
            finalWidth = finalHeight * aspectRatio;
        } else {
            finalWidth = winWidth;
            finalHeight = finalWidth / aspectRatio;
        }
        const container = document.getElementById('gameContainer');
        container.style.width = finalWidth + 'px';
        container.style.height = finalHeight + 'px';
        const dpr = window.devicePixelRatio || 1;
        holst.width = Math.floor(finalWidth * dpr);
        holst.height = Math.floor(finalHeight * dpr);
        kist.setTransform(1, 0, 0, 1, 0, 0);
        kist.scale(dpr, dpr);
        globalScale = finalWidth / GAME_BASE_WIDTH;

        const uiScale = Math.max(0.5, Math.min(globalScale, 1.2));
        [uiPanelLevel, uiPanelNozhei].forEach(el => {
            if (el) {
                const newSize = Math.max(10, 24 * uiScale);
                el.style.fontSize = newSize + 'px';
                const shadowSize = Math.max(1, 2 * uiScale);

    function initAudio() {
        if (audioContext) return true;
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return false;
            audioContext = new AudioCtx();
            masterGain = audioContext.createGain();
            masterGain.gain.value = isMuted ? 0 : currentVolume;
            masterGain.connect(audioContext.destination);
            return true;
        } catch (e) { return false; }
    }

    function unlockAudio() {
        if (isAudioUnlocked) return;
        if (initAudio() && audioContext.state === 'suspended') {
            audioContext.resume().then(() => { isAudioUnlocked = true; }).catch(() => {});
        }
        isAudioUnlocked = true;
    }
    document.addEventListener('click', unlockAudio, { once: true, passive: true });

    function loadAudioFiles() {
        const audioCount = Object.keys(audioFileList).length;
        if (!initAudio()) {
            for (let i = 0; i < audioCount; i++) assetLoaded();
            return;
        }
        Object.entries(audioFileList).forEach(([key, url]) => {
            fetch(url)
                .then(res => res.ok ? res.arrayBuffer() : Promise.reject(new Error('404')))
                .then(buf => audioContext.decodeAudioData(buf))
                .then(dec => {
                    audioBuffers[key] = dec;
                    assetLoaded();
                })
                .catch(() => {
                    assetLoaded();
                });
        });
    }

            const gn = audioContext.createGain();
            gn.gain.value = currentVolume;
            src.connect(gn); gn.connect(masterGain);
            src.start(0);
        } catch (e) {}
    }

     kartinkaBoss, kartinkaPizza, kartinkaBurger, kartinkaStump, kartinkaGolem].forEach(img => {
        img.onload = assetLoaded;
        img.onerror = assetLoaded;
    });

    vseSkins.forEach(s => {
        const i = new Image();
        i.src = s.file;
        i.onload = assetLoaded;
        i.onerror = assetLoaded;
        kartinkiOruzhiya[s.id] = i;
    });

    // === ОБРАБОТЧИКИ КНОПОК ===
    if (knopkaIgrat) {
        knopkaIgrat.onclick = function() {
            unlockAudio();
            sbrosIgry();
        };
    }
    if (knopkaMagazin) {
        knopkaMagazin.onclick = function() {
            if (uiGlavnoeMenu) uiGlavnoeMenu.classList.add("skryto");
            if (uiEkranMagazina) uiEkranMagazina.classList.remove("skryto");
            otrisovatMagazin();
        };
    }
    if (knopkaNazadIzMagazina) {
        knopkaNazadIzMagazina.onclick = function() {
            if (uiEkranMagazina) uiEkranMagazina.classList.add("skryto");
            if (uiGlavnoeMenu) uiGlavnoeMenu.classList.remove("skryto");
        };
    }

    // Пауза и выход в меню
    if (knopkaPauza) knopkaPauza.onclick = otkrytPauzu;
    if (knopkaProdolzit) knopkaProdolzit.onclick = zakrytPauzu;
    if (knopkaRestartPauza) knopkaRestartPauza.onclick = function() { zakrytPauzu(); sbrosIgry(); };
    if (knopkaVMenyu) knopkaVMenyu.onclick = function() { zakrytPauzu(); vozvratVMenyu(); };
    if (knopkaVMenyuGO) knopkaVMenyuGO.onclick = function() { vozvratVMenyu(); };
    // RESTART на экране поражения = честный рестарт без рекламы
    if (knopkaZanovo) knopkaZanovo.onclick = function() { sbrosIgry(); };

    function dobavitMonety(k) {
        monety += k;
        updateUI();
        saveData();
        if (sostoyanieIgry === "MENU") {
            otrisovatMagazin();
            const b = document.getElementById("knopkaSunduk");
            if (b) b.disabled = monety < 30;
        }
    }

    window._game = {};
    window._game.otkrytSunduk = function() {
        const b = document.getElementById("knopkaSunduk");
        if (monety < 30 || (b && b.disabled)) return;
        if (b) b.disabled = true;
        dobavitMonety(-30);
        playSnd("chest");
        const c = document.getElementById("kartinkaSunduka");
        if (c) c.classList.add("chest-opening");
        setTimeout(() => {
            if (c) c.classList.remove("chest-opening");
            const sh = Math.random();
            let nag = "", leg = false;
            if (sh <= 0.05 && !kuplyennyeSkins.includes("legendary")) {
                kuplyennyeSkins.push("legendary");
                saveData();
                nag = t("legendaryReward");
                const tx = document.getElementById("tekstNagrady");
                if (tx) tx.style.color = "#FFD700";
                leg = true;
            } else {
                const r = Math.random();
                let k = 0;
                if (r < 0.35) k = 10;
                else if (r < 0.75) k = 20;
                else if (r < 0.90) k = 30;
                else if (r < 0.97) k = 40;
                else k = 50;
                dobavitMonety(k);
                nag = "+" + k + " 🍎";
                const tx = document.getElementById("tekstNagrady");
                if (tx) tx.style.color = "white";
            }
            playSnd("win");
            const tx = document.getElementById("tekstNagrady");
            if (tx) tx.innerText = nag;
            const pp = document.getElementById("popupNagrada");
            if (pp) pp.classList.remove("skryto");
        }, 800);
    };

    window._game.zakrytPopup = function() {
        const p = document.getElementById("popupNagrada");
        if (p) p.classList.add("skryto");
        otrisovatMagazin();
    };

    window._game.kupitSkin = function(id) {
        const s = vseSkins.find(x => x.id === id);
        if (!s) return;
        if (monety >= s.price && !kuplyennyeSkins.includes(id)) {
            dobavitMonety(-s.price);
            kuplyennyeSkins.push(id);
            saveData();
            playSnd("apple");
            window._game.vybratSkin(id);
        }
    };

    window._game.vybratSkin = function(id) {
        if (kuplyennyeSkins.includes(id)) {
            vybrannyiSkinId = id;
            saveData();
            otrisovatMagazin();
        }
    };

    function otrisovatMagazin() {
        if (!uiSetkaSkinov) return;
        let h = "";
        vseSkins.forEach(s => {
            if (s.isGacha && !kuplyennyeSkins.includes(s.id)) return;
            const ok = kuplyennyeSkins.includes(s.id);
            const eq = (vybrannyiSkinId === s.id);
            let bh = "";
            if (eq) {
                bh = `<button class="MknopkaVybrano" disabled>${t("equipped")}</button>`;
            } else if (ok) {
                bh = `<button class="MknopkaVybrat" onclick="window._game.vybratSkin('${s.id}')">${t("equip")}</button>`;
            } else {
                const can = monety >= s.price;
                bh = `<button class="${can ? "MknopkaKupit" : "MknopkaKupit serya"}" onclick="window._game.kupitSkin('${s.id}')" ${!can ? "disabled" : ""}>${s.price} 🍎</button>`;
            }
            const skinName = t(s.id);
            let desc = "";
            if (s.id === "knife") desc = currentLang === 'ru' ? "Стандартный нож" : "Standard knife";
            else if (s.id === "pencil") desc = currentLang === 'ru' ? "Летит очень быстро" : "Flies very fast";
            else if (s.id === "sword") desc = currentLang === 'ru' ? "Увеличенный сбор яблок" : "Increased apple collection";
            else if (s.id === "shuriken") desc = currentLang === 'ru' ? "x" + s.coinMult + " монет за яблоко" : "x" + s.coinMult + " coins per apple";
            else if (s.id === "axe") desc = currentLang === 'ru' ? "Пробивает 1 шип" : "Pierces 1 spike";
            else if (s.id === "wand") desc = currentLang === 'ru' ? "Замедляет время" : "Slows down time";
            else if (s.id === "legendary") desc = currentLang === 'ru' ? "x" + s.coinMult + " монет, пробитие и замедление" : "x" + s.coinMult + " coins, pierce & slow";
            else desc = currentLang === 'ru' ? "Обычный" : "Common";
            h += `<div class="${s.isGacha ? "kartochkaSkina legendary" : "kartochkaSkina"}">
                <img src="${s.file}" alt="${skinName}">
                <div class="nazvanieSkina">${skinName}</div>
                <div class="opisanieSkina">${desc}</div>
                ${bh}
            </div>`;
        });
        uiSetkaSkinov.innerHTML = h;
        const b = document.getElementById("knopkaSunduk");
        if (b) {
            b.disabled = monety < 30;
            b.innerText = t("open") + " (30 🍎)";
        }
    }

    if (knopkaVoskresheniya) {
        knopkaVoskresheniya.onclick = function() {
            PlatformAdapter.showRewarded(
                pauseGameForAd,
                voskresitIgryoka,
                resumeGameAfterAd,
                resumeGameAfterAd
            );
        };
    }

    function voskresitIgryoka() {
        if (uiEkranProigrysha) uiEkranProigrysha.classList.add("skryto");
        nozh.y = startNozhY;
        nozh.letit = false;
        sostoyanieIgry = "PLAY";
        padayushiyNozh = null;
        krasnayaVspyshka = 0;
        updateHUD();
    }

    function vozvratVMenyu() {
        sostoyanieIgry = "MENU";
        pauzaAktivna = false;
        if (uiEkranProigrysha) uiEkranProigrysha.classList.add("skryto");
        if (ekranPauzy) ekranPauzy.classList.add("skryto");
        if (uiGlavnoeMenu) uiGlavnoeMenu.classList.remove("skryto");
        if (uiPanelMonet) uiPanelMonet.classList.remove("skryto");
        vteknutieNozhi = [];
        yablokiNaArbuze = [];
        bronyaNaArbuze = [];
        oskolki = [];
        nozh.letit = false;
        nozh.y = startNozhY;
        padayushiyNozh = null;
        updateHUD();
    }

    function sdelatBrosok() {
        if (sostoyanieIgry === "PLAY" && !nozh.letit && ostalosNozhei > 0) {
            nozh.letit = true;
            playSnd("throw");
        }
    }

    function handleInput(e) {
        const tgt = e.target;
        if (tgt.id === "polzunokZvuka" || tgt.id === "knopkaZvuka" || tgt.id === "knopkaYazyka" ||
            tgt.id === "knopkaPauza" ||
            tgt.closest('.knopka') || tgt.closest('#panelZvuka') ||
            tgt.closest('#panelYazyka') || tgt.closest('#panelPauza')) return;
        if (e.type === 'touchstart' || e.type === 'mousedown') {
            e.preventDefault();
            sdelatBrosok();
        }
    }

    if (holst) {
        holst.addEventListener("mousedown", handleInput);
        holst.addEventListener("touchstart", handleInput, { passive: false });
    }

    window.addEventListener("keydown", function(e) {
        if (e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp") {
            if (e.code === "Space") e.preventDefault();
            sdelatBrosok();
        }
        if (e.code === "Escape") {
            if (pauzaAktivna) zakrytPauzu();
            else otkrytPauzu();
        }
    });

    function sbrosIgry() {
        uroven = 1;
        nozhiDlyaPobedy = 5;
        ostalosNozhei = 5;
        vteknutieNozhi = [];
        oskolki = [];
        vsplyvayushieTeksty = [];
        skorostArbuza = 0.03 * SPEED_MULTIPLIER;
        tryaskaEkrana = 0;
        krasnayaVspyshka = 0;
        padayushiyNozh = null;
        nozh.y = startNozhY;
        nozh.letit = false;
        fazaDvizheniya = 0;
        pauzaAktivna = false;
        if (ekranPauzy) ekranPauzy.classList.add("skryto");
        if (arbuz) arbuz.y = arbuz.bazi_Y;
        meteor.aktiven = false;
        meteor.skorost = 0.04 * SPEED_MULTIPLIER;
        sostoyanieIgry = "PLAY";
        if (uiGlavnoeMenu) uiGlavnoeMenu.classList.add("skryto");
        sozdatYablokiIBronyu();
        updateHUD();
        updateUI();
    }

    function sozdatYablokiIBronyu() {
        yablokiNaArbuze = [];
        bronyaNaArbuze = [];
        bronyaProbytaNaUrovne = false;
        let ky = Math.floor(Math.random() * 3);
        for (let i = 0; i < ky; i++) {
            let p = 0, u;
            do { u = Math.random() * Math.PI * 2; p++; } while (!bezopasnyUgol(u, yablokiNaArbuze, 0.65) && p < 50);
            yablokiNaArbuze.push(u);
        }
        if (uroven >= 3) {
            let kb = 1 + Math.floor(uroven / 5);
            if (kb > 3) kb = 3;
            for (let j = 0; j < kb; j++) {
                let p = 0, u;
                let z = yablokiNaArbuze.concat(bronyaNaArbuze);
                do { u = Math.random() * Math.PI * 2; p++; } while (!bezopasnyUgol(u, z, 0.65) && p < 50);
                bronyaNaArbuze.push(u);
            }
        }
    }

    function bezopasnyUgol(nu, mz, md) {
        for (let i = 0; i < mz.length; i++) {
            let r = Math.abs(nu - mz[i]) % (Math.PI * 2);
            if (r > Math.PI) r = (Math.PI * 2) - r;
            if (r < md) return false;
        }
        return true;
    }

    function sleduyushiyUroven() {
        playSnd("win");
        tryaskaEkrana = 15;
        const cv = ["#ff3333", "#cc0000", "#ff6666", "#2eb82e", "#000", "#d4a373"];
        for (let i = 0; i < 80; i++) {
            const es = Math.random() > 0.85;
            oskolki.push({
                x: 200, y: arbuz.y,
                vx: (Math.random() - 0.5) * 25, vy: (Math.random() - 0.5) * 25 - 5,
                razmer: es ? 3 : Math.random() * 8 + 3,
                cvet: es ? "#000" : cv[Math.floor(Math.random() * cv.length)],
                zhizn: 1, skorostIscheznoveniya: Math.random() * 0.02 + 0.01
            });
        }
        uroven++;
        const eb = (uroven % 5 === 0);
        let bn = 5 + Math.floor(uroven / 3);
        if (eb) bn += 1;
        if (bn > 7) bn = 7;
        nozhiDlyaPobedy = bn;
        ostalosNozhei = bn;
        vteknutieNozhi = [];
        sozdatYablokiIBronyu();
        let ns = 0.03 + (uroven * 0.002);
        if (ns > 0.07) ns = 0.07;
        skorostArbuza = ns * SPEED_MULTIPLIER * (Math.random() > 0.5 ? 1 : -1);
        if (uroven >= 8) {
            meteor.aktiven = true;
            meteor.skorost = (0.03 + Math.random() * 0.04) * SPEED_MULTIPLIER;
            if (Math.random() > 0.5) meteor.skorost *= -1;
        } else {
            meteor.aktiven = false;
        }
        updateHUD();
        // Interstitial только между уровнями (естественная пауза)
        PlatformAdapter.showInterstitial(pauseGameForAd, resumeGameAfterAd, resumeGameAfterAd);
    }

    function poluchitKartinkuMisheni() {
        const eb = (uroven % 5 === 0);
        const ep = Math.ceil(uroven / 5) % 3;
        if (ep === 1) return eb ? kartinkaBoss : kartinkaArbuz;
        if (ep === 2) return eb ? kartinkaBurger : kartinkaPizza;
        return eb ? kartinkaGolem : kartinkaStump;
    }

    function igrovoiCikl(currentTime) {
        deltaTime = (currentTime - lastTime) / 1000;
        lastTime = currentTime;
        if (deltaTime > 0.1) deltaTime = 0.1;
        requestAnimationFrame(igrovoiCikl);
        kist.clearRect(0, 0, holst.width, holst.height);
        kist.save();
        kist.scale(globalScale, globalScale);
        if (tryaskaEkrana > 0) {
            kist.translate((Math.random() - 0.5) * tryaskaEkrana, (Math.random() - 0.5) * tryaskaEkrana);
            tryaskaEkrana -= 0.5;
        }
        const eb = (uroven % 5 === 0);
        const ss = poluchitStatiSkina();
        let tr = arbuz.razmer;
        let mx = 0, my = 0;
        if (meteor.aktiven && (sostoyanieIgry === "PLAY" || sostoyanieIgry === "GAMEOVER")) {
            meteor.ugol += meteor.skorost * deltaTime * 60;
            mx = arbuz.x + Math.cos(meteor.ugol) * meteor.radiusOtArbuza;
            my = arbuz.y + Math.sin(meteor.ugol) * meteor.radiusOtArbuza;
        }
        if (sostoyanieIgry === "PLAY") {
            if (uroven >= 6) {
                fazaDvizheniya += (0.04 + (uroven * 0.001)) * deltaTime * 60;
                arbuz.y = arbuz.bazi_Y + Math.sin(fazaDvizheniya) * 30;
                if (uroven >= 11) tr = arbuz.razmer + Math.sin(fazaDvizheniya * 2.5) * 15;
            } else {
                arbuz.y = arbuz.bazi_Y;
            }
            if (nozh.letit) {
                nozh.y -= ss.speed * deltaTime * 60;
                if (meteor.aktiven) {
                    const dx = nozh.x - mx, dy = nozh.y - my;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d < meteor.razmer + nozh.shirina / 2) {
                        playSnd("fail");
                        nozh.letit = false;
                        sostoyanieIgry = "GAMEOVER";
                        tryaskaEkrana = 25;
                        krasnayaVspyshka = 0.8;
                        for (let s = 0; s < 30; s++) {
                            oskolki.push({
                                x: mx, y: my,
                                vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20,
                                razmer: Math.random() * 5 + 2, cvet: "#FFA500", zhizn: 1,
                                skorostIscheznoveniya: Math.random() * 0.02 + 0.01
                            });
                        }
                        padayushiyNozh = { x: nozh.x, y: nozh.y, vx: (Math.random() > 0.5 ? 6 : -6), vy: -10, ugol: 0, vrashenie: 0.4 };
                        nozh.y = 9999;
                        if (uiTekushiyUroven) uiTekushiyUroven.innerText = uroven;
                        if (uiEkranProigrysha) uiEkranProigrysha.classList.remove("skryto");
                        updateHUD();
                    }
                }
                if (nozh.letit && nozh.y <= arbuz.y + tr) {
                    nozh.letit = false;
                    const uz = -ugolArbuza;
                    let pn = false, pb = false, ib = -1;
                    for (let i = 0; i < vteknutieNozhi.length; i++) {
                        let r = Math.abs(uz - vteknutieNozhi[i]) % (Math.PI * 2);
                        if (r > Math.PI) r = (Math.PI * 2) - r;
                        if (r < 0.35) { pn = true; break; }
                    }
                    for (let k = 0; k < bronyaNaArbuze.length; k++) {
                        let r = Math.abs(uz - bronyaNaArbuze[k]) % (Math.PI * 2);
                        if (r > Math.PI) r = (Math.PI * 2) - r;
                        if (r < 0.45) { pb = true; ib = k; break; }
                    }
                    if (pb && ss.pierce && !bronyaProbytaNaUrovne) {
                        bronyaNaArbuze.splice(ib, 1);
                        bronyaProbytaNaUrovne = true;
                        pb = false;
                        for (let s = 0; s < 20; s++) {
                            oskolki.push({
                                x: nozh.x, y: nozh.y - 20,
                                vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15 - 5,
                                razmer: Math.random() * 5 + 3, cvet: "#888", zhizn: 1,
                                skorostIscheznoveniya: Math.random() * 0.02 + 0.01
                            });
                        }
                        nozh.y = startNozhY;
                        tryaskaEkrana = 8;
                    } else if (pn || pb) {
                        playSnd("fail");
                        sostoyanieIgry = "GAMEOVER";
                        tryaskaEkrana = 20;
                        krasnayaVspyshka = 0.6;
                        for (let s = 0; s < 25; s++) {
                            oskolki.push({
                                x: 200, y: arbuz.y + tr,
                                vx: (Math.random() - 0.5) * 20, vy: (Math.random() - 0.5) * 20,
                                razmer: Math.random() * 4 + 2, cvet: "#FFF", zhizn: 1,
                                skorostIscheznoveniya: Math.random() * 0.02 + 0.01
                            });
                        }
                        padayushiyNozh = { x: nozh.x, y: arbuz.y + tr, vx: (Math.random() > 0.5 ? 5 : -5), vy: -15, ugol: 0, vrashenie: 0.3 };
                        nozh.y = 9999;
                        if (uiTekushiyUroven) uiTekushiyUroven.innerText = uroven;
                        if (uiEkranProigrysha) uiEkranProigrysha.classList.remove("skryto");
                        updateHUD();
                    } else {
                        for (let j = 0; j < yablokiNaArbuze.length; j++) {
                            let r = Math.abs(uz - yablokiNaArbuze[j]) % (Math.PI * 2);
                            if (r > Math.PI) r = (Math.PI * 2) - r;
                            if (r < ss.appleHitbox) {
                                playSnd("apple");
                                yablokiNaArbuze.splice(j, 1);
                                const ng = 1 * ss.coinMult;
                                dobavitMonety(ng);
                                for (let s = 0; s < 15; s++) {
                                    oskolki.push({
                                        x: 200, y: arbuz.y + tr,
                                        vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10,
                                        razmer: Math.random() * 4 + 2, cvet: "#FFD700", zhizn: 1,
                                        skorostIscheznoveniya: Math.random() * 0.02 + 0.01
                                    });
                                }
                                vsplyvayushieTeksty.push({ text: "+" + ng, x: 200 + (Math.random() - 0.5) * 30, y: arbuz.y + tr, vy: -2, zhizn: 1 });
                                break;
                            }
                        }
                        vteknutieNozhi.push(uz);
                        ostalosNozhei--;
                        if (ostalosNozhei <= 0) sleduyushiyUroven();
                        nozh.y = startNozhY;
                        updateHUD();
                    }
                }
            }
            if (eb && Math.random() < 0.008) skorostArbuza = -skorostArbuza;
            ugolArbuza += skorostArbuza * ss.slow * deltaTime * 60;
        }

        for (let i = oskolki.length - 1; i >= 0; i--) {
            let o = oskolki[i];
            o.x += o.vx * deltaTime * 60;
            o.y += o.vy * deltaTime * 60;
            o.vy += 0.8 * deltaTime * 60;
            o.zhizn -= o.skorostIscheznoveniya * deltaTime * 60;
            if (o.zhizn > 0) {
                kist.globalAlpha = Math.max(0, o.zhizn);
                kist.fillStyle = o.cvet;
                kist.beginPath();
                kist.arc(o.x, o.y, o.razmer, 0, Math.PI * 2);
                kist.fill();
                kist.globalAlpha = 1;
            } else {
                oskolki.splice(i, 1);
            }
        }

        const an = kartinkiOruzhiya[vybrannyiSkinId];
        const am = poluchitKartinkuMisheni();
        if (meteor.aktiven) {
            kist.save();
            kist.translate(mx, my);
            kist.rotate(meteor.ugol * 3);
            kist.drawImage(kartinkaMeteor, -meteor.razmer, -meteor.razmer, meteor.razmer * 2, meteor.razmer * 2);
            kist.restore();
        }
        kist.save();
        kist.translate(arbuz.x, arbuz.y);
        kist.rotate(ugolArbuza);
        for (let i = 0; i < vteknutieNozhi.length; i++) {
            kist.save();
            kist.rotate(vteknutieNozhi[i]);
            if (an) kist.drawImage(an, -nozh.shirina / 2, tr - 30, nozh.shirina, nozh.vysota);
            kist.restore();
        }
        if (am) kist.drawImage(am, -tr, -tr, tr * 2, tr * 2);
        for (let i = 0; i < yablokiNaArbuze.length; i++) {
            kist.save();
            kist.rotate(yablokiNaArbuze[i]);
            kist.translate(0, tr + 30);
            kist.rotate(Math.PI);
            kist.drawImage(kartinkaYabloko, -50, -50, 100, 100);
            kist.restore();
        }
        for (let i = 0; i < bronyaNaArbuze.length; i++) {
            kist.save();
            kist.rotate(bronyaNaArbuze[i]);
            kist.translate(0, tr + 20);
            kist.rotate(Math.PI);
            kist.drawImage(kartinkaBronya, -25, -25, 50, 50);
            kist.restore();
        }
        kist.restore();

        if ((sostoyanieIgry === "PLAY" || sostoyanieIgry === "GAMEOVER") && ostalosNozhei > 0 && padayushiyNozh === null && an) {
            kist.drawImage(an, nozh.x - nozh.shirina / 2, nozh.y, nozh.shirina, nozh.vysota);
        }

        if (padayushiyNozh && an) {
            padayushiyNozh.vy += 0.8 * deltaTime * 60;
            padayushiyNozh.x += padayushiyNozh.vx * deltaTime * 60;
            padayushiyNozh.y += padayushiyNozh.vy * deltaTime * 60;
            padayushiyNozh.ugol += padayushiyNozh.vrashenie * deltaTime * 60;
            kist.save();
            kist.translate(padayushiyNozh.x, padayushiyNozh.y);
            kist.rotate(padayushiyNozh.ugol);
            kist.drawImage(an, -nozh.shirina / 2, -nozh.vysota / 2, nozh.shirina, nozh.vysota);
            kist.restore();
        }

        for (let i = vsplyvayushieTeksty.length - 1; i >= 0; i--) {
            let v = vsplyvayushieTeksty[i];
            v.y += v.vy * deltaTime * 60;
            v.zhizn -= 0.02 * deltaTime * 60;
            if (v.zhizn > 0) {
                kist.globalAlpha = Math.max(0, v.zhizn);
                kist.fillStyle = "#FFD700";
                kist.font = "bold 40px Arial";
                kist.textAlign = "center";
                kist.fillText(v.text, v.x, v.y);
                kist.globalAlpha = 1;
            } else {
                vsplyvayushieTeksty.splice(i, 1);
            }
        }
        kist.restore();

        if (krasnayaVspyshka > 0) {
            kist.fillStyle = `rgba(255,0,0,${krasnayaVspyshka})`;
            kist.fillRect(0, 0, holst.width, holst.height);
            krasnayaVspyshka -= 0.02 * deltaTime * 60;
        }
    }

    // === ЗАПУСК ===
    async function initGame() {
        await PlatformAdapter.init();

        let savedLang = null;
        try { savedLang = localStorage.getItem('vk_snaiper_lang'); } catch (e) {}
        const detectedLang = PlatformAdapter.getLanguage();
        currentLang = (savedLang === 'ru' || savedLang === 'en') ? savedLang : detectedLang;
        applyLanguage();

        PlatformAdapter.signalReady();
        nastroikaEkrana();
        loadDataFromAdapter();
        loadAudioFiles();

        setTimeout(finishLoading, 8000);
    }

    window.addEventListener("resize", forceResize);
    window.addEventListener("orientationchange", () => { setTimeout(forceResize, 100); });

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', forceResize);
        window.visualViewport.addEventListener('scroll', forceResize);
    }

    window.addEventListener("load", () => {
        setTimeout(forceResize, 100);
        setTimeout(forceResize, 500);
        setTimeout(forceResize, 1000);
        initGame();
    });

    nastroikaEkrana();
})();
</script>
