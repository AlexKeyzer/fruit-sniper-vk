<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Фруктовый Снайпер</title>
    <meta property="og:title" content="Фруктовый Снайпер">
    <meta name="vk-game-title" content="Фруктовый Снайпер">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container" id="gameContainer">
            <canvas id="igrovoePole"></canvas>
            <div id="preloader">
                <div class="preloader-title">ФРУКТОВЫЙ СНАЙПЕР</div>
                <div class="preloader-bar-container">
                    <div class="preloader-bar" id="preloaderBar"></div>
                </div>
                <div class="preloader-percent" id="preloaderPercent">0%</div>
            </div>
            <div id="interfeis">
                <div id="panelZvuka">
                    <button id="knopkaZvuka" class="knopkaZvukaOformlenie" aria-label="Sound">🔊</button>
                    <input type="range" id="polzunokZvuka" min="0" max="1" step="0.1" value="0.4" aria-label="Volume">
                </div>
                <div id="panelPauza" class="skryto">
                    <button id="knopkaPauza" class="knopkaPauzaOformlenie" aria-label="Pause">❚❚</button>
                </div>
                <div id="panelYazyka">
                    <button id="knopkaYazyka" class="knopkaYazykaOformlenie" aria-label="Language">🌐 RU</button>
                </div>
                <div id="panelMonet">
                    <img src="apple.png" alt="Apples" class="ikonkaMonety">
                    <span id="schetMonet">0</span>
                </div>
                <div id="panelLevel" class="game-hud skryto">
                    <span id="tekstLevel">Level: 1</span>
                </div>
                <div id="panelNozhei" class="game-hud skryto">
                    <span id="tekstNozhei">Knives: 5</span>
                </div>
                <div id="tuutorialHint" class="skryto"></div>
                <div id="glavnoeMenu" class="ekran main-menu popup-scale-target">
                    <p id="tekstRekord">Рекорд: уровень 1</p>
                    <p id="tekstStreak" class="menuNote"></p><!-- NEW -->
                    <p id="tekstNextSkin" class="menuNote"></p><!-- NEW -->
                    <button id="knopkaIgrat" class="knopka">PLAY</button>
                    <button id="knopkaMagazin" class="knopka knopkaMagazinaCvet">SKINS SHOP</button>
                    <button id="knopkaSharMenu" class="knopka knopkaSharCvet">SHARE</button><!-- NEW -->
                </div>
                <div id="ekranMagazina" class="ekran popup-scale-target skryto">
                    <h2 id="ui_armory">ARMORY</h2>
                    <div class="ruletkaBlok">
                        <img src="chest.png" id="kartinkaSunduka" alt="Chest">
                        <div>
                            <h3 id="ui_chest" style="margin:0; color: #FFD700;">LUCKY CHEST</h3>
                            <p id="ui_chance" style="margin:5px 0; font-size:12px; color:#aaa;">Legendary Chance: 5%</p>
                            <button class="knopka MknopkaKupit" id="knopkaSunduk" onclick="window._game.otkrytSunduk()">OPEN (30 🍎)</button>
                            <button class="knopka knopkaReklama" id="knopkaChestFree" style="margin-top:6px;" onclick="window._game.chestFree()">
                                <span class="btn-icon">🎬</span><span class="btn-text">FREE CHEST</span>
                            </button>
                        </div>
                    </div>
                    <div id="setkaSkinov" class="setka"></div>
                    <button id="knopkaNazadIzMagazina" class="knopka">BACK TO MENU</button>
                </div>
                <div id="ekranPauzy" class="ekran popup-overlay popup-scale-target skryto">
                    <h2 id="ui_pauseTitle">PAUSE</h2>
                    <button id="knopkaProdolzit" class="knopka">CONTINUE</button>
                    <button id="knopkaRestartPauza" class="knopka serya">RESTART</button>
                    <button id="knopkaVMenyu" class="knopka knopkaMagazinaCvet">MAIN MENU</button>
                </div>
                <div id="popupNagrada" class="ekran popup-overlay popup-scale-target skryto">
                    <h2 id="ui_reward" style="color:white;">REWARD!</h2>
                    <h1 id="tekstNagrady" style="color: #FFD700; margin: 10px 0; font-size: 30px;">50 🍎</h1>
                    <button id="ui_claim" class="knopka" onclick="window._game.zakrytPopup()">CLAIM</button>
                </div>
                <div id="popupDaily" class="ekran popup-overlay popup-scale-target skryto">
                    <h2 id="ui_daily_title">ЕЖЕДНЕВНАЯ НАГРАДА</h2>
                    <p id="tekstDailyStreak" class="dailyStreak"></p><!-- NEW -->
                    <h1 id="tekstDaily" style="color: #FFD700; margin: 10px 0; font-size: 30px;">+20 🍎</h1>
                    <button id="knopkaDailyClaim" class="knopka">ЗАБРАТЬ</button>
                    <button id="knopkaDailyDouble" class="knopka knopkaReklama">
                        <span class="btn-icon">🎬</span>
                        <span class="btn-text">×2 ЗА ВИДЕО</span>
                    </button>
                </div>
                <div id="popupLevelComplete" class="ekran popup-overlay popup-scale-target skryto">
                    <h2 id="ui_lc_title">УРОВЕНЬ ПРОЙДЕН!</h2>
                    <h1 id="tekstLcReward" style="color: #FFD700; margin: 10px 0; font-size: 30px;">+5 🍎</h1>
                    <button id="knopkaLcClaim" class="knopka">ЗАБРАТЬ</button>
                    <button id="knopkaLcDouble" class="knopka knopkaReklama">
                        <span class="btn-icon">🎬</span>
                        <span class="btn-text">×2 ЗА ВИДЕО</span>
                    </button>
                </div>
                <div id="ekranProigrysha" class="ekran popup-overlay popup-scale-target skryto">
                    <h1 id="ui_gameover" class="krasnyiTekst" style="font-size: 22px;">GAME OVER!</h1>
                    <p><span id="ui_lvl_text">Level:</span> <span id="tekushiyUrovenUI">1</span></p>
                    <p id="uiRunStats" class="runStats"></p>
                    <button id="knopkaShar" class="knopka knopkaSharCvet">SHARE</button><!-- NEW -->
                    <button id="knopkaRunX2" class="knopka knopkaReklama skryto">
                        <span class="btn-icon">🎬</span>
                        <span class="btn-text">×2 ЗА ВИДЕО</span>
                    </button>
                    <button id="knopkaVoskresheniya" class="knopka knopkaReklama">
                        <span class="btn-icon">🎬</span>
                        <span class="btn-text">CONTINUE<br><small>FOR VIDEO AD</small></span>
                    </button>
                    <button id="knopkaZanovo" class="knopka serya">RESTART</button>
                    <button id="knopkaVMenyuGO" class="knopka knopkaMagazinaCvet">MAIN MENU</button>
                </div>
                <div id="toastShar" class="toast"></div><!-- NEW -->
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
